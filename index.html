<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pre-paint theme: read the stored choice, resolve `system` against the OS
      // preference, and set the `.dark` class before first paint so there is no
      // flash of the wrong theme. The storage key matches THEME_STORAGE_KEY in
      // src/lib/theme/theme.ts.
      (() => {
        const root = document.documentElement;
        try {
          const stored = localStorage.getItem("theme");
          const choice =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const dark = choice === "dark" || (choice === "system" && prefersDark);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch {
          /* Ignore storage or matchMedia errors and keep the default theme. */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iron Capital - Investment Partnership</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
